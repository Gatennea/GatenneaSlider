name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest 而非 ubuntu：游戏字体走 C:/Windows/Fonts/simhei.ttf
    # 硬路径（_gui_safe_font 第一层），Linux 无此字体，GUI 渲染测试会
    # 环境性失败。Windows runner 同时复现本机开发环境，减少割裂。
    runs-on: windows-latest
    # 兜底：求解器全图测试（_test_bfs_explore）最慢约十几分钟，60 分钟
    # 足够全量跑完；真挂死时烧满 6 小时默认额度没有意义
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pytest numpy

      - name: Compile all sources
        # 只编正式代码与 test/：experiments/ 是研究草稿（不随 main 发布），
        # 不进 CI 门面
        run: python -m compileall -q GUI.py game.py game_triangle.py game_mi.py gui solver test

      - name: Run regression tests
        env:
          # conftest 子进程用的解释器：CI 上就是本 job 的 python
          # （pygame-ce / numpy 已装），与本地 D:/python/python.exe 等价
          GATENNEA_PY: python
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: pytest test/ -v
