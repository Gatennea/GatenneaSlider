name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # windows-latest 而非 ubuntu：游戏字体走 C:/Windows/Fonts/simhei.ttf
    # 硬路径（_gui_safe_font 第一层），Linux 无此字体，GUI 渲染测试会
    # 环境性失败。Windows runner 同时复现本机开发环境，减少割裂。
    runs-on: windows-latest
    # 兜底：求解器全图测试（_test_bfs_explore / _test_mi_gather）最慢约二三十分钟，
    # 120 分钟足够全量跑完；真挂死时烧满 6 小时默认额度没有意义。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pytest numpy

      - name: Compile all sources
        # 只编正式代码与 test/：experiments/ 是研究草稿（不随 main 发布），
        # 不进 CI 门面。engine/ macro/ 是产品代码，必须一起编（2026-10-31 补，
        # 原先漏了这两个包，语法错会一路漏到运行时）。
        run: python -m compileall -q GUI.py game.py game_triangle.py game_mi.py engine gui solver macro tools test

      - name: Run regression tests
        env:
          # conftest 子进程用的解释器：CI 上就是本 job 的 python
          # （pygame-ce / numpy 已装），与本地 D:/python/python.exe 等价
          GATENNEA_PY: python
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        # 2026-10-31 起不再排除 _test_tri_gather.py：该文件原先因 C3c 一条
        # 已知失败（k=5 三角聚拢复原 0/8，用户 2026-10-22 拍板保持现状、非回归，
        # 详见 docs/agent/待办清单.md §十五）被整个 --ignore —— 代价是同文件里
        # C3a/C3b/C3d/**C3e** 等 20 条护栏一起常年不跑，而 C3e（k=4 ≥ 5/10）
        # 才是真正的回归护栏。现在 C3c 走脚本内 KNOWN_FAILS 白名单：数值照常
        # 打印、不计入 exit code，其余 20 条重新在 CI 上真跑。
        # 白名单项若哪天转绿，脚本会打 [RECOVERED] 并刻意非零退出逼人销账。
        run: pytest test/ -v

  lint:
    # 静态审查守门：复用仓库内 tools/static_lint。与 test job 统一走
    # windows-latest，遵循本仓库既有约定（见 test job 注释：Windows runner
    # 复现本机环境、避免潜在的跨平台差异），不另起一套 OS。
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce

      - name: Static lint (dead code / dup / mixin override)
        # --strict：任何相对 baseline 的新增问题都非零退出，挡住回归。
        # baseline.json 锚定了当前 61 条已知签名（含 §十一/§十二 已记录
        # 的 engine->solver 反向依赖、GUI.py 未用 import 等），它们作为
        # "已知、可接受"基线，将来谁引入同类新问题才会在此冒红。
        run: python -m tools.static_lint.runner --baseline tools/static_lint/baseline.json --strict

      - name: Experiments naming guard (script_ / reuse_ 前缀守门)
        # experiments/ 的前缀只承担「调用关系」一个维度（2026-10-31 与用户定的
        # 三类）：script_* 独立脚本 / reuse_* 两者皆是 / 无前缀=库。
        # 这里用 AST 重新判定真实类别，与文件名前缀比对，不符就红 ——
        # 挡住「改名漏改 import」「加了 script_ 却被人 import 了」这类腐化。
        run: python tools/experiments_index.py --check

      - name: Doc link check (文档里的文件引用 / §X 节号)
        # 拦两类文档腐烂：引用了不存在的文件、引用了不存在的节号。
        # 起因：2026-10-31 一晚手修了 4 处（docs/README.md 的「§十一」实为 §七、
        # bandaged_mode.md 的「§六之二」实为 §一、待办清单头部旧说明、AGENTS.md §17
        # 引的数学真源只在 feat/math-research 分支），靠人眼扫不可持续。
        # 当前 16 条真断链 + 3 条同名歧义已锚进 doclink_baseline.json，并在
        # 待办清单 §十六 逐条登记；这里守的是「别再新增」。
        run: python tools/doclink_check.py --baseline tools/doclink_baseline.json --strict
