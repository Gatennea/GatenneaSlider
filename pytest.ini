[pytest]
# 只扫 test/（experiments/ 是研究草稿，不进回归）
testpaths = test
# 禁内置 python 收集：test/ 下的 .py 全部由 conftest.py 的
# pytest_collect_file 钩子接管（有 __main__ 守卫的走子进程脚本）。
# 不禁的话内置 Module 收集会与 ScriptTestFile 双收——同一文件
# 跑两遍（Module import 一遍 + 子进程一遍）。
python_files = __conftest_managed__.py
# 报告摘要：跳过/失败都列出来，CI 日志一眼看清
addopts = -ra
