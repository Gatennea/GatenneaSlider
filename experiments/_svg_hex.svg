<text x="12" y="131" font-size="11.5" fill="#c0392b">· 竖直 x=√3/2：吻合同行竖边，切穿下一行块心</text>
<text x="12" y="150" font-size="11.5" fill="#c0392b">· 水平（h 族 rank 线 t=0）：穿过整行块心</text>
<text x="12" y="184" font-size="11.5" fill="#2471a3">蓝 = 真实竖裂纹（同行共享边，行行错开半格）</text>
